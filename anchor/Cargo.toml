[package]
name = "staratlas-meetups"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# anchor-spl = "0.30.1"
# solana-program = "2.2.1"

[dev-dependencies]
anchor-lang = "0.30.1"
litesvm = { git = "https://github.com/LiteSVM/litesvm", rev = "7e3d9a8" }
litesvm-loader = { git = "https://github.com/LiteSVM/litesvm", rev = "7e3d9a8" }
meetups = { path = "programs/meetups", features = ["no-entrypoint"] }
solana-sdk = "2.2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
